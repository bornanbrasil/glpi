apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
  namespace: client-bornan
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 1Gi
